<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Upload Project</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #020617, #0f172a);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial;
        color: white;
      }

      /* BOX */
      .container {
        background: rgba(30, 41, 59, 0.9);
        padding: 30px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        text-align: center;
      }

      /* TITLE */
      .container h2 {
        margin-bottom: 20px;
        color: #38bdf8;
      }

      /* INPUTS */
      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
        outline: none;
      }

      /* FILE INPUT */
      input[type="file"] {
        background: #020617;
        color: white;
      }

      /* BUTTON */
      button {
        width: 100%;
        padding: 12px;
        margin: 10px;
        background: #38bdf8;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4);
      }

      /* STATUS */
      #status {
        margin-top: 10px;
        font-size: 0.9rem;
      }
    </style>
  </head>

  <body>
    <script type="module">
      import { auth } from "./js/firebase.js";

      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      onAuthStateChanged(auth, (user) => {
        console.log(user);

        if (!user) {
          alert("Access Denied");

          window.location.href = "login.html";
        }
      });
      import { signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      window.logout = async function () {
        await signOut(auth);

        alert("Logged Out");

        window.location.href = "login.html";
      };
    </script>

    <div class="container">
      <h2>Upload Project</h2>

      <input type="file" id="file" />
      <input type="text" id="title" placeholder="Project Title" />

      <select id="category">
        <option value="bedroom">Bedroom</option>
        <option value="kitchen">Kitchen</option>
        <option value="tv">TV Unit</option>
        <option value="wardrobe">Wardrobe</option>
        <option value="ceiling">False Ceiling</option>
      </select>

      <button onclick="upload()">Upload</button>
      <button onclick="logout()">Logout</button>

      <p id="status"></p>
    </div>

    <script type="module">
      //UPLOAD CODE
      console.log("upload clicked");
      import { db } from "./js/firebase.js";
      import {
        collection,
        addDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      async function upload() {
        const file = document.getElementById("file").files[0];
        console.log(file);
        const title = document.getElementById("title").value;
        const category = document.getElementById("category").value;
        const status = document.getElementById("status");

        if (!file) {
          alert("Select file first");
          return;
        }

        status.innerText = "Uploading...";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "Anyupload");
        console.log("before fetch");
        try {
          const res = await fetch(
            "https://api.cloudinary.com/v1_1/dpt0hfl2z/image/upload",
            {
              method: "POST",
              body: formData,
            },
          );

          const data = await res.json();
          console.log("Cloudinary response:", data);

          // 🔥 IMPORTANT CHECK
          if (!res.ok) {
            status.innerText = "Upload Failed ❌";
            alert(data.error?.message || "Upload error");
            return;
          }

          // ✅ SUCCESS
          await addDoc(collection(db, "gallery"), {
            url: data.secure_url,
            title: title || "Project Work",
            category: category,
            type: data.resource_type,
          });

          status.innerText = "Uploaded Successfully ✅";
        } catch (err) {
          status.innerText = "Upload Failed ❌";
          console.log(err);
        }
      }

      window.upload = upload;
    </script>
  </body>
</html>
